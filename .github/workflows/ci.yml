name: CI

on:
  push:
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 类型与架构边界
        run: bun run typecheck && bun run typecheck:node && bun run check:boundaries
      - name: 后端、契约与迁移回归测试
        run: bun run test
      - name: 构建 Bun API
        run: bun run build:api

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 校验 OpenAPI 生成文件
        run: bun run gen:api && git diff --exit-code -- packages/contracts/openapi.json frontend/src/api/schema.d.ts
      - name: 运行前端回归测试
        run: bun run test:web
      - name: 前端类型、Lint 与构建
        run: bun run --cwd frontend typecheck && bun run --cwd frontend lint && bun run build:web

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 构建 Web、Electron 主进程与 Preload
        run: bun run build:web && bun run build:desktop:main
      - name: 编译当前平台 Hono sidecar 与 ONNX Runtime
        run: bun run build:desktop:backend
      - name: 检查桌面运行资源
        run: test -x apps/desktop/resources/backend/techspar-api && test -f apps/desktop/resources/backend/onnxruntime/onnxruntime_binding.node
      - name: 校验 Electron 打包配置
        run: bun run --cwd apps/desktop pack

  voice-input-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖和 Electron 运行时
        run: |
          bun install --frozen-lockfile
          node apps/desktop/node_modules/electron/install.js
      - name: Windows Electron 合成音频验收
        run: bun run smoke:voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-voice-input-smoke
          path: dist/voice-input-smoke/
          if-no-files-found: ignore
